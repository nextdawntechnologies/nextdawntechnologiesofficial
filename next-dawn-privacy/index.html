<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Privacy Policy for Next Dawn Technologies Co., Ltd."
    />
    <meta name="theme-color" content="#6d50f5" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="assets/brand-mark.png" />
    <link rel="apple-touch-icon" href="assets/brand-mark.png" />
    <title>Privacy Policy · Next Dawn Technologies Co., Ltd.</title>
    <style>
      :root {
        --ink: #161321;
        --muted: #6f6b7c;
        --line: #e8e5ef;
        --surface: #ffffff;
        --canvas: #fbfaff;
        --purple: #6d50f5;
        --purple-deep: #4d36bd;
        --orange: #ff8a4d;
        --orange-soft: #fff1e8;
        --violet-soft: #f0edff;
        --radius-xl: 28px;
        --radius-lg: 18px;
        --shadow: 0 18px 45px rgba(37, 29, 73, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 90% 0%, rgba(255, 138, 77, 0.13), transparent 28rem),
          radial-gradient(circle at 5% 12%, rgba(109, 80, 245, 0.1), transparent 27rem),
          var(--canvas);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans TC",
          "Hiragino Sans", "Yu Gothic", "Malgun Gothic", system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.75;
      }

      a {
        color: var(--purple-deep);
        text-underline-offset: 0.18em;
      }

      a:hover {
        color: var(--purple);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .skip-link {
        position: fixed;
        z-index: 10;
        top: 0.8rem;
        left: 0.8rem;
        transform: translateY(-160%);
        padding: 0.55rem 0.9rem;
        color: #fff;
        background: var(--ink);
        border-radius: 999px;
        transition: transform 0.2s ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .site-header {
        width: min(1160px, calc(100% - 40px));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin: 0 auto;
        padding: 24px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--ink);
        font-weight: 750;
        letter-spacing: -0.025em;
        text-decoration: none;
      }

      .brand img {
        width: 37px;
        height: 37px;
        border-radius: 11px;
        box-shadow: 0 6px 18px rgba(75, 54, 165, 0.12);
      }

      .brand small {
        display: block;
        margin-top: -0.1rem;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .header-actions {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
      }

      .header-label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 650;
      }

      .language-select {
        appearance: none;
        min-height: 38px;
        padding: 0.4rem 2.15rem 0.4rem 0.8rem;
        color: var(--ink);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 680;
        background:
          linear-gradient(45deg, transparent 50%, var(--purple) 50%) calc(100% - 14px) 52% / 5px
            5px no-repeat,
          linear-gradient(135deg, var(--purple) 50%, transparent 50%) calc(100% - 9px) 52% / 5px
            5px no-repeat,
          #fff;
        border: 1px solid #ded9eb;
        border-radius: 10px;
        cursor: pointer;
      }

      .language-select:focus-visible {
        outline: 3px solid rgba(109, 80, 245, 0.22);
        outline-offset: 2px;
      }

      .shell {
        width: min(1160px, calc(100% - 40px));
        margin: 0 auto 68px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: clamp(2rem, 5vw, 4.6rem);
        color: #fff;
        background: #18142c;
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
      }

      .hero::before,
      .hero::after {
        position: absolute;
        content: "";
        border-radius: 999px;
        transform: rotate(-32deg);
      }

      .hero::before {
        top: -56px;
        right: -64px;
        width: 260px;
        height: 88px;
        background: linear-gradient(90deg, var(--purple), #8a6aff);
      }

      .hero::after {
        right: 82px;
        bottom: -69px;
        width: 275px;
        height: 96px;
        background: linear-gradient(90deg, var(--orange), #ffaf72);
      }

      .eyebrow {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.95rem;
        color: #d7d0ff;
        font-size: 0.8rem;
        font-weight: 760;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 7px;
        height: 7px;
        content: "";
        background: var(--orange);
        border-radius: 50%;
      }

      h1 {
        position: relative;
        z-index: 1;
        max-width: 730px;
        margin: 0;
        font-size: clamp(2rem, 5.1vw, 4.1rem);
        line-height: 1.15;
        letter-spacing: -0.06em;
      }

      .hero p:not(.eyebrow) {
        position: relative;
        z-index: 1;
        max-width: 700px;
        margin: 1.1rem 0 0;
        color: #d9d5e8;
        font-size: clamp(1rem, 1.8vw, 1.13rem);
      }

      .hero-meta {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin-top: 1.65rem;
      }

      .hero-meta span {
        padding: 0.38rem 0.72rem;
        color: #f4f1ff;
        font-size: 0.82rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }

      .notice {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.85rem;
        margin: 22px 0;
        padding: 1rem 1.1rem;
        color: #514452;
        background: var(--orange-soft);
        border: 1px solid #ffd9c5;
        border-radius: var(--radius-lg);
      }

      .notice strong {
        color: #8d4c28;
      }

      .notice-icon {
        display: grid;
        width: 28px;
        height: 28px;
        color: #fff;
        background: var(--orange);
        border-radius: 9px;
        place-items: center;
        font-size: 0.9rem;
        font-weight: 800;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(190px, 0.28fr) minmax(0, 1fr);
        align-items: start;
        gap: clamp(1.25rem, 4vw, 4rem);
        margin-top: 22px;
      }

      .toc {
        position: sticky;
        top: 1rem;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(231, 227, 239, 0.95);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(12px);
      }

      .toc-title {
        margin: 0 0 0.55rem;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .toc a {
        display: block;
        padding: 0.48rem 0.55rem;
        color: #4b4655;
        font-size: 0.9rem;
        font-weight: 620;
        text-decoration: none;
        border-radius: 9px;
      }

      .toc a:hover,
      .toc a:focus-visible {
        color: var(--purple-deep);
        background: var(--violet-soft);
        outline: none;
      }

      .policy {
        min-width: 0;
        padding: clamp(1.25rem, 3vw, 3rem);
        background: var(--surface);
        border: 1px solid #ece9f2;
        border-radius: var(--radius-xl);
        box-shadow: 0 10px 35px rgba(29, 24, 62, 0.045);
      }

      section {
        scroll-margin-top: 1rem;
      }

      .policy section + section {
        margin-top: 2.8rem;
        padding-top: 2.8rem;
        border-top: 1px solid var(--line);
      }

      h2 {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0 0 0.85rem;
        font-size: clamp(1.28rem, 2.4vw, 1.7rem);
        line-height: 1.3;
        letter-spacing: -0.035em;
      }

      h2::before {
        width: 8px;
        height: 28px;
        flex: 0 0 auto;
        content: "";
        background: linear-gradient(180deg, var(--purple), var(--orange));
        border-radius: 999px;
      }

      h3 {
        margin: 1.3rem 0 0.35rem;
        font-size: 1rem;
      }

      p,
      li {
        color: #4f4a59;
      }

      p {
        margin: 0.55rem 0;
      }

      ul {
        margin: 0.7rem 0 0;
        padding-left: 1.25rem;
      }

      li + li {
        margin-top: 0.45rem;
      }

      .data-cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
        margin-top: 1rem;
      }

      .data-card {
        padding: 1rem;
        background: #fbfaff;
        border: 1px solid #ece8fb;
        border-radius: 15px;
      }

      .data-card strong {
        display: block;
        margin-bottom: 0.25rem;
        color: var(--ink);
      }

      .data-card p {
        margin: 0;
        font-size: 0.9rem;
      }

      .placeholder {
        padding: 0.08rem 0.35rem;
        color: #773e22;
        font-weight: 700;
        background: #fff0e8;
        border-radius: 5px;
      }

      .contact-card {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 1rem;
        margin-top: 1.1rem;
        padding: 1.2rem;
        background: #f8f7ff;
        border: 1px solid #e8e4ff;
        border-radius: 16px;
      }

      .contact-symbol {
        display: grid;
        width: 52px;
        height: 52px;
        color: #fff;
        background: var(--purple);
        border-radius: 16px;
        place-items: center;
        font-size: 1.25rem;
      }

      .contact-card p {
        margin: 0;
      }

      .contact-card p + p {
        margin-top: 0.35rem;
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.75rem;
        width: min(1160px, calc(100% - 40px));
        margin: 0 auto;
        padding: 0 0 42px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      @media (max-width: 780px) {
        .site-header,
        .shell,
        .footer {
          width: min(100% - 28px, 1160px);
        }

        .header-label {
          display: none;
        }

        .hero {
          border-radius: 22px;
        }

        .content-grid {
          grid-template-columns: 1fr;
        }

        .toc {
          position: static;
          display: flex;
          flex-wrap: wrap;
          gap: 0.25rem;
        }

        .toc-title {
          width: 100%;
        }

        .toc a {
          padding: 0.35rem 0.5rem;
          font-size: 0.82rem;
          background: #f8f7fb;
        }

        .data-cards {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 480px) {
        .site-header {
          align-items: flex-start;
        }

        .brand small {
          display: none;
        }

        .language-select {
          max-width: 150px;
        }

        .contact-card {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        body {
          background: #fff;
        }

        .site-header,
        .toc,
        .notice {
          display: none;
        }

        .shell,
        .footer {
          width: 100%;
        }

        .hero,
        .policy {
          box-shadow: none;
        }
      }
    </style>
  </head>

      const sectionTemplate = (section, policy) => {
        const intro = section.intro ? `<p>${section.intro}</p>` : "";
        const cards = section.cards
          ? `<div class="data-cards">${section.cards
              .map(
                ([title, text]) =>
                  `<div class="data-card"><strong>${title}</strong><p>${text}</p></div>`
              )
              .join("")}</div>`
          : "";
        const list = section.list
          ? `<ul>${section.list.map((item) => `<li>${item}</li>`).join("")}</ul>`
          : "";
        const paragraphs = (section.paragraphs || [])
          .map((paragraph) => `<p>${paragraph}</p>`)
          .join("");
        const contact =
          section.id === "contact"
            ? `
              <div class="contact-card">
                <div class="contact-symbol" aria-hidden="true">✦</div>
                <div>
                  <p><strong>Next Dawn Technologies Co., Ltd.</strong></p>
                  <p>${policy.contactEmailLabel} <a href="mailto:${email}"><span class="placeholder">${email}</span></a></p>
                  <p>${policy.contactNote}</p>
                </div>
              </div>`
            : "";
        return `<section id="${section.id}"><h2>${section.title}</h2>${intro}${cards}${list}${paragraphs}${contact}</section>`;
      };

      const renderPolicy = (key) => {
        const policy = policies[key] || policies.en;
        document.documentElement.lang = policy.lang;
        document.title = policy.documentTitle;
        document.getElementById("language-select").value = key;
        document.getElementById("language-label").textContent = policy.languageLabel;
        document.getElementById("header-label").textContent = policy.headerLabel;
        document.getElementById("skip-link").textContent = policy.skipLink;
        document.getElementById("hero-eyebrow").textContent = policy.eyebrow;
        document.getElementById("page-title").textContent = policy.title;
        document.getElementById("hero-lead").textContent = policy.lead;
        document.getElementById("hero-meta").setAttribute("aria-label", policy.metaLabel);
        document.getElementById("hero-meta").innerHTML = policy.meta
          .map((item) => `<span>${item}</span>`)
          .join("");
        document.getElementById("notice").setAttribute("aria-label", policy.noticeLabel);
        document.getElementById("notice-copy").innerHTML =
          `<strong>${policy.noticeStrong}</strong> ${policy.noticeText}`;
        document.getElementById("toc").setAttribute("aria-label", policy.tocTitle);
        document.getElementById("toc").innerHTML =
          `<p class="toc-title">${policy.tocTitle}</p>` +
          policy.sections.map((section) => `<a href="#${section.id}">${section.nav}</a>`).join("");
        document.getElementById("policy").innerHTML = policy.sections
          .map((section) => sectionTemplate(section, policy))
          .join("");
        document.getElementById("footer-copyright").textContent =
          "© 2026 Next Dawn Technologies Co., Ltd.";
        document.getElementById("footer-version").textContent = policy.footerVersion;
      };

      document.getElementById("language-select").addEventListener("change", (event) => {
        renderPolicy(event.target.value);
